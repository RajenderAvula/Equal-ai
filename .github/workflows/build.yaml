name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: android/app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Fails fast with a clear message if the app module isn't where Gradle expects it.
      - name: Check project layout
        run: |
          echo "Repo root:"; ls -la
          echo "$APP_DIR folder:"; ls -la "$APP_DIR" 2>/dev/null || echo "(no $APP_DIR folder)"
          if [ ! -f "$APP_DIR/build.gradle.kts" ] && [ ! -f "$APP_DIR/build.gradle" ]; then
            echo "::error::$APP_DIR/build.gradle.kts is missing. The app module (build.gradle.kts and src/) must be in $APP_DIR."
            exit 1
          fi
          if ! grep -q "com.android.application" "$APP_DIR/build.gradle.kts" "$APP_DIR/build.gradle" 2>/dev/null; then
            echo "::error::$APP_DIR/build.gradle(.kts) does not apply the com.android.application plugin."
            exit 1
          fi
          if [ ! -f "$APP_DIR/src/main/AndroidManifest.xml" ]; then
            echo "::error::$APP_DIR/src/main/AndroidManifest.xml is missing."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle itself, so no gradlew / wrapper jar is needed in the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Retries only when the failure looks like a flaky download, not a real build error.
      - name: Build debug APK
        run: |
          set -o pipefail
          flags=""
          for attempt in 1 2 3; do
            if gradle :app:assembleDebug --stacktrace $flags 2>&1 | tee build.log; then
              exit 0
            fi
            if ! grep -qiE "Could not (resolve|GET|HEAD|download)|Read timed out|Connection (reset|refused)|Received status code 5" build.log; then
              echo "Build failed for a non-network reason; not retrying."
              exit 1
            fi
            echo "Download problem on attempt $attempt. Retrying in 30 seconds..."
            flags="--refresh-dependencies"
            sleep 30
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: equal-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
